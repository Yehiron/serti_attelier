# Local development stack. Run from the repository root:
#   cp .env.example .env
#   docker compose -f infra/docker-compose.dev.yml up --build
name: serti-dev

x-backend: &backend
  build:
    context: ../backend
    target: runtime
    args:
      REQUIREMENTS: dev
  env_file: ../.env
  environment:
    WOMPI_ALLOW_FAKE_API: "true"
    WOMPI_API_URL: http://wompi-fake:8080/v1
    WOMPI_PUBLIC_KEY: pub_test_e2e_public
    WOMPI_PRIVATE_KEY: prv_test_e2e_private
    WOMPI_INTEGRITY_SECRET: test_integrity_e2e_secret
    WOMPI_EVENTS_SECRET: test_events_e2e_secret
  volumes:
    - ../backend:/app
    - ../frontend/lib/api:/frontend/lib/api:ro
    # Lets the backend test suite exercise the fake's contract (read-only).
    - ./wompi-fake:/infra/wompi-fake:ro
    - ./scripts:/infra/scripts:ro
    - ./Caddyfile:/infra/Caddyfile:ro
    - ./Caddyfile.dev:/infra/Caddyfile.dev:ro
  depends_on:
    wompi-fake:
      condition: service_started
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # No published ports; control is reachable only inside the Compose network.
  wompi-fake:
    image: python:3.12-alpine
    command: python /fake/server.py
    environment:
      WOMPI_EVENTS_SECRET: test_events_e2e_secret
    volumes:
      - ./wompi-fake:/fake:ro

  db:
    image: postgres:16-alpine
    env_file: ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info
    # The image healthcheck probes the web port, which Celery does not serve.
    healthcheck:
      disable: true

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    # The image healthcheck probes the web port, which Celery does not serve.
    healthcheck:
      disable: true

  frontend:
    build:
      context: ../frontend
      target: dev
    env_file: ../.env
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      # Server-side rendering talks to Django directly inside the Compose network.
      API_INTERNAL_URL: http://backend:8000/api/v1
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next

  # Opt-in encrypted copies and isolated verification; source media are read-only.
  backup:
    profiles: [backup]
    build:
      context: .
      dockerfile: backup/Dockerfile
    env_file: ../.env
    volumes:
      - ${BACKUP_DIR:-../backups}:/backups
      - ../backend/media:/srv/media:ro
      - ../backend/private_media:/srv/private_media:ro

  mailpit:
    image: axllent/mailpit:latest

  caddy:
    image: caddy:2-alpine
    env_file: ../.env
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8090:8090"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
  caddy_data:
