name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: serti
          POSTGRES_USER: serti
          POSTGRES_PASSWORD: serti
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U serti" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://serti:serti@localhost:5432/serti
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/lint.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: mypy
        run: mypy .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Deploy checklist
        run: python manage.py check --deploy --fail-level WARNING --settings=config.settings.prod
        env:
          DJANGO_SECRET_KEY: ci-${{ github.run_id }}-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJ
          DJANGO_ALLOWED_HOSTS: example.com
          COUPON_EMAIL_PEPPER: ci-only-pepper
      - name: Tests
        run: pytest --cov=apps --cov-report=term-missing
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements/base.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          push: false
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          target: runtime
          push: false

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Development environment (throwaway values, fake Wompi keys)
        run: |
          cp .env.example .env
          {
            echo "INTERNAL_API_TOKEN=ci-$(openssl rand -hex 24)"
            echo "COUPON_EMAIL_PEPPER=ci-$(openssl rand -hex 24)"
            echo "NEXT_PUBLIC_CART_ENABLED=true"
            echo "WOMPI_PUBLIC_KEY=pub_test_dev_fake"
            echo "WOMPI_INTEGRITY_SECRET=test_integrity_ci_fake"
            echo "WOMPI_EVENTS_SECRET=test_events_ci_fake"
            echo "SERTI_ORDERS_EMAIL=pedidos@serti.localhost"
            echo "THROTTLE_ORDERS_MINUTE=60/min"
            echo "THROTTLE_ORDERS_HOUR=1000/hour"
          } >> .env
      # Before the stack: Docker would create frontend/node_modules as root (anonymous volume mount point).
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start stack
        run: |
          make up
          for i in $(seq 60); do curl -fs http://localhost:8090/api/v1/health/ready && break; sleep 5; done
          make seed
      - name: Playwright
        run: npx playwright test
        working-directory: frontend
      - name: Stack logs
        if: failure()
        run: docker compose -f infra/docker-compose.dev.yml logs --tail=200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
