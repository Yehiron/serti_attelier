<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="font-size:14px;line-height:1.5;">
<tr><td style="padding:6px 0;color:#58513d;">{{ l_subtotal }}</td><td align="right" style="padding:6px 0;">{{ subtotal }}</td></tr>
<tr><td style="padding:6px 0;color:#58513d;">{{ l_discount }}</td><td align="right" style="padding:6px 0;">− {{ discount }}</td></tr>
<tr><td style="padding:6px 0;color:#58513d;">{{ l_shipping }}</td><td align="right" style="padding:6px 0;">{{ shipping }}</td></tr>
<tr><td style="padding:6px 0;color:#58513d;">{{ l_certificate }}</td><td align="right" style="padding:6px 0;">{{ certificate_price }}</td></tr>
<tr><td style="padding:12px 0 0;border-top:1px solid #7a7256;font-size:16px;color:#651c32;"><strong>{{ l_total }}</strong></td><td align="right" style="padding:12px 0 0;border-top:1px solid #7a7256;font-size:16px;color:#651c32;"><strong>{{ total }}</strong></td></tr>
</table>
