{% if row.changes %}<div class="aud-changes"><div class="aud-change aud-change-head"><span>Campo</span><span>Antes</span><span>Después</span></div>{% for change in row.changes %}<div class="aud-change"><strong>{{ change.label }}</strong><span data-label="Antes">{{ change.before }}</span><span data-label="Después">{{ change.after }}</span></div>{% endfor %}</div>{% else %}<p>Sin cambios de campos registrados.</p>{% endif %}
