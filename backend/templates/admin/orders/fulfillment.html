{% extends "admin/base_site.html" %}
{% load i18n %}
{% block content %}
<h1>{{ title }}</h1>
<form method="post">{% csrf_token %}
{{ form.as_p }}
{% for order in orders %}<input type="hidden" name="_selected_action" value="{{ order.pk }}"><p>{{ order.number }}</p>{% endfor %}
<input type="hidden" name="action" value="fulfillment">
<button type="submit" name="apply" value="1">{% translate "Aplicar" %}</button>
</form>
{% endblock %}
