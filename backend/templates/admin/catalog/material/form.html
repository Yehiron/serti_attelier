<form class="mat-form" method="post" novalidate>{% csrf_token %}{{ pane_form.non_field_errors }}<h2>{% if creating %}Nuevo material{% else %}Editar material{% endif %}</h2><label>Nombre (ES){{ pane_form.name_es }}{{ pane_form.name_es.errors }}</label><label>Name (EN){{ pane_form.name_en }}{{ pane_form.name_en.errors }}</label><label>Tono{{ pane_form.color }}{{ pane_form.color.errors }}</label><div class="mat-swatches"><button type="button" data-color="#d9b25f" aria-label="Amarillo"></button><button type="button" data-color="#dcdcd8" aria-label="Blanco"></button><button type="button" data-color="#c9ccce" aria-label="Plata"></button><button type="button" data-color="#e3a98e" aria-label="Rosa"></button><button type="button" data-color="#e8d3a3" aria-label="Champán"></button><button type="button" data-color="#4b4b4f" aria-label="Negro rodio"></button><button type="button" data-color="#e5e4e2" aria-label="Platino"></button><button type="button" data-color="#b08d57" aria-label="Bronce"></button><input type="color" aria-label="Otro tono" data-custom-color></div><div class="mat-orb mat-preview" style="--mat-color:#d9b25f"></div><details><summary>Dirección web</summary><label>Dirección (ES){{ pane_form.slug_es }}{{ pane_form.slug_es.errors }}</label><label>Dirección (EN){{ pane_form.slug_en }}{{ pane_form.slug_en.errors }}</label></details>{{ pane_form.position.as_hidden }}{{ pane_form.position.errors }}<div class="mat-actions"><button class="mat-button mat-primary" type="submit">Guardar</button><a href="{% url 'admin:catalog_material_changelist' %}">Cancelar</a></div></form>
