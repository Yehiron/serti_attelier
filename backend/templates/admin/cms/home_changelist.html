{% extends "admin/change_list.html" %}
{% load i18n %}
{% block object-tools-items %}
{{ block.super }}
{% if can_preview %}
<a class="border px-3 py-2 rounded-default" href="{% url 'admin:cms-home-preview' %}">{% translate "Vista previa" %}</a>
{% endif %}
{% if can_publish %}
<form method="post" action="{% url 'admin:cms-home-publish' %}">
  {% csrf_token %}
  <button class="border px-3 py-2 rounded-default" type="submit">{% translate "Publicar" %}</button>
</form>
{% endif %}
{% endblock %}
