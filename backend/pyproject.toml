[project]
name = "serti-backend"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "DJ", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
# Código existente sin anotaciones: se revisa su cuerpo (check_untyped_defs) pero no se exige
# anotar cada función. El código nuevo debe llevar tipos.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["celery.*", "environ.*", "django_otp.*", "axes.*", "unfold.*", "qrcode.*", "gunicorn.*"]
ignore_missing_imports = true

# Las pruebas se validan ejecutándolas: no se revisa el cuerpo de sus funciones sin anotar.
[[tool.mypy.overrides]]
module = ["apps.*.tests.*", "conftest"]
check_untyped_defs = false
# Serializadores de secciones generados dinámicamente (apps/cms/api/serializers.py) y
# resultados opcionales que la propia prueba garantiza.
disable_error_code = ["attr-defined", "union-attr"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--strict-markers --ds=config.settings.test"
markers = ["postgres: requires PostgreSQL extensions or row locks"]
